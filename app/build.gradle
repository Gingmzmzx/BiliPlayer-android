import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

// ============================================================
// 自动 versionCode：年 + 月 + 日 + 当日构建数，格式 YYMMDDNN
//   例：26092701 = 26 年 09 月 27 日的第 1 次构建
//   日期与计数保存在根目录 build-stamp.properties，日期不是今天就归零重数。
//   用 ValueSource 而不是在脚本里直接 new Date()：配置缓存
//   （org.gradle.configuration-cache=true）复用时，带参数的 ValueSource
//   会重新求值，避免版本号被缓存成上一次的旧值。
// ============================================================
def buildStamp = providers.of(BuildStampSource) {
    it.parameters.stampFile.set(rootProject.layout.projectDirectory.file('build-stamp.properties').asFile)
}.get()

// 每次真正执行构建后把当日计数 +1（配置阶段只读不写）
def bumpBuildStamp = tasks.register('bumpBuildStamp') {
    description = '记录本次构建，使同一日期内的构建号递增'
    def stampFile = rootProject.layout.projectDirectory.file('build-stamp.properties').asFile
    outputs.upToDateWhen { false }
    doLast {
        String today = new Date().format(BuildStampSource.DATE_PATTERN)
        def props = new Properties()
        if (stampFile.exists()) {
            stampFile.withInputStream { props.load(it) }
        }
        int count = (props.getProperty('date') == today) ? ((props.getProperty('count') ?: '0') as int) : 0
        props.setProperty('date', today)
        props.setProperty('count', String.valueOf(count + 1))
        stampFile.withOutputStream { props.store(it, 'BiliPlayer build stamp') }
    }
}
tasks.matching { it.name == 'preBuild' || it.name.startsWith('assemble') }.configureEach {
    dependsOn(bumpBuildStamp)
}

android {
    namespace 'com.netessx.biliplayer'
    compileSdk {
        // 依赖（androidx.core 1.19.0 等）要求 compileSdk >= 37
        version = release(37)
    }

    defaultConfig {
        applicationId "com.netessx.biliplayer"
        minSdk 24
        targetSdk 36
        versionCode buildStamp.toInteger()
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

