// ============================================================
// versionCode 取值源：读 build-stamp.properties，算出 YYMMDDNN。
// 只读不写，因此多次求值结果一致（配置缓存要求）。
// ============================================================
interface BuildStampParameters extends ValueSourceParameters {
    Property<File> getStampFile()
}

abstract class BuildStampSource implements ValueSource<String, BuildStampParameters> {

    static final String DATE_PATTERN = 'yyMMdd'

    @Override
    String obtain() {
        String today = new Date().format(DATE_PATTERN)
        try {
            File stampFile = parameters.stampFile.get()
            int count = 0
            if (stampFile.exists()) {
                def props = new Properties()
                stampFile.withInputStream { props.load(it) }
                if (props.getProperty('date') == today) {
                    count = (props.getProperty('count') ?: '0') as int
                }
            }
            return String.format('%s%02d', today, count + 1)
        } catch (Exception e) {
            // 文件不可读写时退化为当日第 1 次构建，不让构建直接失败
            return today + '01'
        }
    }
}